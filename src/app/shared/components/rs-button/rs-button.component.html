<ion-button
  [type]="type"
  [color]="color"
  [expand]="expand"
  [fill]="fill"
  [disabled]="disabled || loading"
  (click)="onClick()">

  <ion-spinner *ngIf="loading" name="crescent" slot="start"></ion-spinner>

  <!-- ICON ONLY -->
  <ng-content *ngIf="!label"></ng-content>

  <!-- ICON + LABEL -->
  <ng-container *ngIf="label">
    <ion-icon *ngIf="icon && !loading" [name]="icon" slot="start"></ion-icon>
    {{ label }}
  </ng-container>

</ion-button>
